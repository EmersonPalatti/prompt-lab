kind: cleaning

cases:
  - id: city_typo
    question: Normalize só as cidades.
    input_rows:
      - id: 1
        city: S. Paulo
        status: paid
        amount: 10
      - id: 2
        city: recife
        status: open
        amount: 5
    expected_rows:
      - id: 1
        city: Sao Paulo
        status: paid
        amount: 10
      - id: 2
        city: Recife
        status: open
        amount: 5
  - id: status_synonym
    question: Normalize só os status.
    input_rows:
      - id: 1
        city: Sao Paulo
        status: PAID
        amount: 10
      - id: 2
        city: Recife
        status: pago
        amount: 5
      - id: 3
        city: Sao Paulo
        status: aberto
        amount: 1
    expected_rows:
      - id: 1
        city: Sao Paulo
        status: paid
        amount: 10
      - id: 2
        city: Recife
        status: paid
        amount: 5
      - id: 3
        city: Sao Paulo
        status: open
        amount: 1
  - id: null_city
    question: Trate city vazia, N/A ou null. Não invente cidade.
    input_rows:
      - id: 1
        city: null
        status: paid
        amount: 8
      - id: 2
        city: N/A
        status: open
        amount: 3
      - id: 3
        city: ""
        status: paid
        amount: 2
    expected_rows:
      - id: 1
        city: null
        status: paid
        amount: 8
      - id: 2
        city: null
        status: open
        amount: 3
      - id: 3
        city: null
        status: paid
        amount: 2
  - id: mixed_batch
    question: Normalize city e status. Mantenha amount.
    input_rows:
      - id: 1
        city: S. Paulo
        status: PAID
        amount: 10
      - id: 2
        city: N/A
        status: open
        amount: 99
      - id: 3
        city: RECIFE
        status: aberto
        amount: 5
    expected_rows:
      - id: 1
        city: Sao Paulo
        status: paid
        amount: 10
      - id: 2
        city: null
        status: open
        amount: 99
      - id: 3
        city: Recife
        status: open
        amount: 5
  - id: unknown_status
    question: Status que não for sinônimo conhecido permanece.
    input_rows:
      - id: 1
        city: Sao Paulo
        status: cancelado
        amount: 10
      - id: 2
        city: Recife
        status: PAID
        amount: 5
    expected_rows:
      - id: 1
        city: Sao Paulo
        status: cancelado
        amount: 10
      - id: 2
        city: Recife
        status: paid
        amount: 5
  - id: extra_notes
    question: Ignore chaves que não sejam id, city, status e amount.
    input_rows:
      - id: 1
        city: Sao Paulo
        status: paid
        amount: 10
        notes: vip
    expected_rows:
      - id: 1
        city: Sao Paulo
        status: paid
        amount: 10
