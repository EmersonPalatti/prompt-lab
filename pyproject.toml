[project]
name = "prompt-lab"
version = "0.1.0"
description = "Pipeline de avaliação para geração de SQL e limpeza de dados com LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "litellm>=1.106.5",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "truststore>=0.10.5",
]

[project.scripts]
prompt-lab = "prompt_lab.__main__:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["evals"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
